on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: Release

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
    env:
      NITRO_PRESET: vercel
      # Production-only: mounts Vercel Web Analytics + Speed Insights
      VITE_VERCEL_INSIGHTS: 'true'
      VERCEL_CLI: vercel@63.1.2
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Warm CDN cache
        continue-on-error: true
        run: |
          sleep 5
          curl -s -o /dev/null -w "CDN warm: HTTP %{http_code} in %{time_total}s\n" \
            https://28games.tompiarulli.com/

  badges:
    needs: deploy
    permissions:
      contents: write
    uses: ./.github/workflows/lighthouse-badges.yml
